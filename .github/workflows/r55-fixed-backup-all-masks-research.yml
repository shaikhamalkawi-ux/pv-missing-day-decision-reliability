name: R55 exhaustive 16384 backup counter subsets (RESEARCH ONLY)
on:
  push:
    branches: [r55-pmedc-feasibility-research-only]
    paths:
      - ".github/workflows/r55-fixed-backup-all-masks-research.yml"
      - "experimental/r55_fixed_backup_all_masks_exact.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_locked_all_subsets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Clone and hash-lock original MORE-EU source
        run: |
          git clone --depth 1 https://github.com/MORE-EU/OpenData.git upstream_source
          test "$(git -C upstream_source hash-object 'Solar Park Data -INACCESS/Array Power.csv')" = "5611277efdd581bb839ec380239846a43ebe0ba7"
      - name: Exact all-subset fixed hardware counter design
        run: |
          python experimental/r55_fixed_backup_all_masks_exact.py \
            --source "upstream_source/Solar Park Data -INACCESS/Array Power.csv" \
            --out R55_FIXED_ALL_MASKS_OUTPUTS
      - name: Upload derived results only
        uses: actions/upload-artifact@v4
        with:
          name: r55-all-16384-counter-subsets-derived-only
          path: R55_FIXED_ALL_MASKS_OUTPUTS/
          if-no-files-found: error
          retention-days: 30

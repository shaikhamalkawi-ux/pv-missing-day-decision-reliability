name: R26H HKUST Measured-Power Candidate Screen
on:
  push:
    branches: [r26e-solarmagix-source-intake]
    paths: ['.github/workflows/r26h-hkust-candidate-screen.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hkust-zenodo-10909062-original-zip
          run-id: 42481283218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: hkust_source
      - name: Profile original inverter time-series and provenance
        run: python3 external_data/public_source_probes/profile_hkust_2024.py
      - name: Upload source gate only (no source raw copies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r26h-hkust-measured-power-profiles
          path: R26H_HKUST_FullSchemaGate/
          if-no-files-found: warn
          retention-days: 30

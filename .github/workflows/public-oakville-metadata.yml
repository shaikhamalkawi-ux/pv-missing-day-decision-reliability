name: Oakville and NIST public metadata gate
on:
  push:
    branches: [source-inventory-pvdaq-20261128]
    paths: ['.github/workflows/public-oakville-metadata.yml']
permissions:
  contents: read
jobs:
  source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtain only metadata and CSV header samples
        run: |
          mkdir -p evidence
          python -u - <<'PY'
          import urllib.request,urllib.parse,concurrent.futures,json,hashlib,pathlib,io,csv
          out=pathlib.Path('evidence')
          base='https://data.openei.org/files/6179/'
          requests=[
              ('oakville_README.txt',base+'README%20%281%29.txt',2000000,False),
              ('FPV_metafile_mm.xlsx',base+'FPV_metafile_mm.xlsx',10000000,False),
              ('NIST_portal.html','https://pvdata.nist.gov/',2000000,False),
              ('NIST_landing.html','https://doi.org/10.18434/M3S67G',2000000,False),
              ('oakville_landing.html','https://data.openei.org/submissions/6179',2000000,False)
          ]+[(f'inverter_{i:02d}_header.txt',base+f'FPV_Oakville_CA_Inverter{i}_data.csv',65536,True) for i in range(1,13)]
          def fetch(item):
              name,url,limit,partial=item
              rec={'name':name,'url':url,'partial_header_only':partial}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Public scientific source audit/1.0',**({'Range':f'bytes=0-{limit-1}'} if partial else {})})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read(limit+1)
                      rec.update(status=r.status,final_url=r.url,headers={k:r.headers.get(k) for k in ['Content-Type','Content-Length','Content-Range','ETag','Last-Modified']})
                  if partial:
                      # Only preserve first few lines; no ranking, no test outcomes.
                      data=b'\n'.join(data[:limit].splitlines()[:3])+b'\n'
                  else:
                      assert len(data)<=limit, 'metadata exceeds bounded retrieval limit'
                      if name.endswith('.xlsx'):assert data[:2]==b'PK','not xlsx'
                  (out/name).write_bytes(data)
                  rec.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as e:rec['error']=repr(e)
              print(json.dumps(rec),flush=True)
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:results=list(ex.map(fetch,requests))
          (out/'acquisition.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oakville-nist-public-metadata
          path: evidence/
          retention-days: 14
          if-no-files-found: error

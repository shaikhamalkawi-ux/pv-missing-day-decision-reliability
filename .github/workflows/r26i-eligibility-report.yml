name: R26I Independent Physical Eligibility and Report
on:
  push:
    branches: [r26i-hkust-capacity-sensitivity]
    paths: ['.github/workflows/r26i-eligibility-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r26i-hkust-conditional-evidence
          run-id: 42503693629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: R26I_HKUST_SourceConditional
      - name: Audit source-only tiers and generate report
        run: python3 external_data/public_source_probes/r26i_source_tier_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26i-evidence-source-tiers-and-report
          path: R26I_HKUST_SourceConditional/
          retention-days: 30
          if-no-files-found: error

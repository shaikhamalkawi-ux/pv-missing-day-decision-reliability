name: R62 MORE-EU exact recovery and precision (RESEARCH ONLY)
on:
  push:
    branches: [source-inventory-pvdaq-20261128]
    paths: ['.github/workflows/r62-moreeu-measurement-recovery.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cfd1675853beaa854461fd4069bac6612dec66c
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - run: |
          curl -fsSL https://raw.githubusercontent.com/shaikhamalkawi-ux/pv-missing-day-decision-reliability/d225313abb976d60930fc779c1c0b2c4f16d545a/experimental/r62_minimum_measurement_recovery.py -o experimental/r62_minimum_measurement_recovery.py
          git clone --depth 1 https://github.com/MORE-EU/OpenData.git upstream_source
          test "$(git -C upstream_source hash-object 'Solar Park Data -INACCESS/Array Power.csv')" = "5611277efdd581bb839ec380239846a43ebe0ba7"
          python experimental/r62_minimum_measurement_recovery.py --source "upstream_source/Solar Park Data -INACCESS/Array Power.csv" --out result
      - uses: actions/upload-artifact@v4
        with:
          name: r62-moreeu-measurement-recovery
          path: result/
          retention-days: 30
          if-no-files-found: error

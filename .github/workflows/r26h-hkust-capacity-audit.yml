name: R26H HKUST Original RDF Capacity Crosswalk
on:
  push:
    branches: [r26e-solarmagix-source-intake]
    paths: ['.github/workflows/r26h-hkust-capacity-audit.yml']
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  source_capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hkust-zenodo-10909062-original-zip
          run-id: 42481283218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: r26h-hkust-144slot-admission-audit
          run-id: 42482673762
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: gate
      - name: Frozen source RDF inverter-capacity reconciliation
        run: python3 external_data/public_source_probes/map_hkust_module_ratings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26h-hkust-capacity-crosswalk
          path: R26H_HKUST_CapacityGate/
          if-no-files-found: warn
          retention-days: 30

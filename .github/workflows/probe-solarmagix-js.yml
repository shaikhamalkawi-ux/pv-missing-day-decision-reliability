name: Inspect SolarMagix public JS download integration
on:
  push:
    branches: [r26e-solarmagix-source-intake]
    paths: ['.github/workflows/probe-solarmagix-js.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find publisher public client download routes
        run: |
          python3 - <<'PY'
          import re,urllib.request
          urls=['https://data.mendeley.com/datasets/bundle.js?8814bfd8bfcb6231e2b5','https://static.data.mendeley.com/scripts/script-v2.0.7.min.js']
          for url in urls:
            print('SOURCE',url)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as r:
                s=r.read().decode('utf-8','replace')
                print('HTTP',r.status,'CHARS',len(s))
              for key in ['api.data.mendeley.com','/datasets/publics/','/datasets/','file_downloaded','download-all','downloadAll','download_url','zip/file_downloaded','getPublicDatasetFiles','public-files','file-tree','/files?','content_details']:
                mats=list(re.finditer(re.escape(key),s,re.I))
                print('KEY',key,'COUNT',len(mats))
                for m in mats[:5]:
                  print('SNIP',repr(s[max(0,m.start()-120):min(len(s),m.end()+250)])[:600])
            except Exception as ex:print('ERROR',type(ex).__name__,str(ex)[:250])
          PY

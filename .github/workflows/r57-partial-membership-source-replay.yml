name: R57 PV partial membership and error audit (RESEARCH ONLY)
on:
  push:
    branches: [r55-pmedc-feasibility-research-only]
    paths:
      - ".github/workflows/r57-partial-membership-source-replay.yml"
      - "experimental/r57_partial_resolution_source_replay.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Get and verify exact upstream original source
        run: |
          git clone --depth 1 https://github.com/MORE-EU/OpenData.git upstream_source
          test "$(git -C upstream_source hash-object 'Solar Park Data -INACCESS/Array Power.csv')" = "5611277efdd581bb839ec380239846a43ebe0ba7"
      - name: Execute source-locked partial-decision and error analysis
        run: |
          python experimental/r57_partial_resolution_source_replay.py \
            --source "upstream_source/Solar Park Data -INACCESS/Array Power.csv" \
            --out R57_PARTIAL_DERIVED_ONLY
      - name: Upload derived statistics; no original telemetry
        uses: actions/upload-artifact@v4
        with:
          name: r57-pv-partial-resolution-derived-only
          path: R57_PARTIAL_DERIVED_ONLY/
          retention-days: 30
          if-no-files-found: error

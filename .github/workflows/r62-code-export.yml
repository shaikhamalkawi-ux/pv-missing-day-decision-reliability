name: R62 immutable code export
on:
  push:
    branches: [source-inventory-pvdaq-20261128]
    paths: ['.github/workflows/r62-code-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 482910b45fe68c616689abaaeacdeebbf2c7b836
      - run: |
          mkdir -p export
          cp experimental/r62_minimum_measurement_recovery.py export/
          cp .github/workflows/r62-{moreeu,nist,pvdaq}-measurement-recovery.yml export/
          (cd export && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: r62-frozen-source-code-and-workflows
          path: export/
          retention-days: 30

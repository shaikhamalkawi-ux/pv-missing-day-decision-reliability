name: R26I Native HKUST Irradiance Observed Support Audit
on:
  push:
    branches: [r26i-hkust-capacity-sensitivity]
    paths: ['.github/workflows/r26i-hkust-weather-alignment.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hkust-zenodo-10909062-original-zip
          run-id: 42481283218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Audit original site irradiance and exact 5-minute observation support
        run: python3 external_data/public_source_probes/r26i_hkust_weather_alignment.py
      - name: Preserve reproducible source QA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r26i-hkust-irradiance-alignment
          path: R26I_HKUST_WeatherAlignment/
          if-no-files-found: warn
          retention-days: 30

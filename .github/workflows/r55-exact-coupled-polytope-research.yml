name: R55 exact joint-polytope adaptive rival (RESEARCH ONLY)
on:
  push:
    branches: [r55-pmedc-feasibility-research-only]
    paths:
      - ".github/workflows/r55-exact-coupled-polytope-research.yml"
      - "experimental/r55_exact_coupled_polytope.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_polytope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linear optimization software
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3
      - name: Freeze original source
        run: |
          git clone --depth 1 https://github.com/MORE-EU/OpenData.git upstream_source
          test "$(git -C upstream_source hash-object 'Solar Park Data -INACCESS/Array Power.csv')" = "5611277efdd581bb839ec380239846a43ebe0ba7"
      - name: Exact joint feasibility check (no future claim)
        run: |
          python experimental/r55_exact_coupled_polytope.py \
            --source "upstream_source/Solar Park Data -INACCESS/Array Power.csv" \
            --out R55_EXACT_POLYTOPE_OUTPUTS
      - name: Upload derived outputs, not licensed original records
        uses: actions/upload-artifact@v4
        with:
          name: r55-exact-coupled-polytope-research-derived-only
          path: R55_EXACT_POLYTOPE_OUTPUTS/
          retention-days: 30
          if-no-files-found: error

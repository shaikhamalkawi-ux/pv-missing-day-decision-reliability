name: R26J HKUST Fixed Calibration x Missing Days (Source Gate)
on:
  push:
    branches: [r26j-hkust-calibration-gap-audit]
    paths: ['.github/workflows/r26j-hkust-calibration-audit.yml', 'external_data/public_source_probes/r26j_calibration_gap_audit.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed LP solver
        run: python3 -m pip install scipy==1.16.3
      - name: Fetch independently source-checked R26I daily observation sums
        uses: actions/download-artifact@v4
        with:
          name: r26i-evidence-source-tiers-and-report
          run-id: 42504128089
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Run bounded calibration-error/gap existence audit
        run: python3 external_data/public_source_probes/r26j_calibration_gap_audit.py
      - name: Upload derived source gate only; no raw or R25 manuscript changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r26j-hkust-calibration-gap-lp
          path: R26J_HKUST_CalibrationGapAudit/
          if-no-files-found: warn
          retention-days: 30

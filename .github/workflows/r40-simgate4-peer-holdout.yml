name: R40 SIM-GATE4 no-leak peer ratio prospective-time holdout
on:
  push:
    branches: [r40-simgate4-peer-holdout-evidence]
    paths:
      - ".github/workflows/r40-simgate4-peer-holdout.yml"
      - "experimental/r40_simgate4_peer_holdout.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  peeraudit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve original SHA256-locked HKUST archive from previous verified run
        uses: actions/download-artifact@v4
        with:
          name: hkust-zenodo-10909062-original-zip
          run-id: 42481283218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Install pinned numpy
        run: python -m pip install numpy==2.3.4
      - name: Test holdout without source-site channel or imputation
        run: python experimental/r40_simgate4_peer_holdout.py
      - name: Preserve derived summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r40-simgate4-peer-holdout-derived-only
          path: R40_SIM_GATE4_PeerHoldout/
          retention-days: 30
          if-no-files-found: warn

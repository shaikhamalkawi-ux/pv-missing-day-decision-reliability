name: R26H HKUST Library Development-Only q by Gap Surface
on:
  push:
    branches: [r26e-solarmagix-source-intake]
    paths: ['.github/workflows/r26h-hkust-library-development.yml', 'external_data/public_source_probes/r26h_hkust_library_development.py']
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hkust-zenodo-10909062-original-zip
          run-id: 42481283218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: r26h-hkust-capacity-crosswalk
          run-id: 42482817779
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: capacity
      - name: Compute frozen R22 shortlist grid on admitted Library observations
        run: python3 external_data/public_source_probes/r26h_hkust_library_development.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26h-hkust-library-development-only
          path: R26H_HKUST_Library_Development/
          if-no-files-found: warn
          retention-days: 30

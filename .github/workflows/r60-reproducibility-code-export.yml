name: R60 immutable source-code export
on:
  push:
    branches: [source-inventory-pvdaq-20261128]
    paths: ['.github/workflows/r60-reproducibility-code-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70e12ebaf16c29e28b798841036c63864270ecdb
      - run: |
          mkdir -p export
          cp experimental/r60_observation_constrained_replay.py export/
          cp .github/workflows/r60-moreeu-observation-constraints.yml export/
          cp .github/workflows/r60-nist-observation-constraints.yml export/
          cp .github/workflows/r60-pvdaq-index-observation-constraints.yml export/
          (cd export && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: r60-frozen-source-code-and-workflows
          path: export/
          retention-days: 30

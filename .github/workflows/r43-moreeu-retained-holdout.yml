name: R43 MORE-EU chronology-locked retained-shortlist margin triage
on:
  push:
    branches: [r43-moreeu-retained-margin-timeholdout]
    paths:
      - ".github/workflows/r43-moreeu-retained-holdout.yml"
      - "experimental/r43_retained_margin_holdout.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed_only_holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set reproducible numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.4
      - name: Acquire byte-identical licensed upstream source, never redistribute raw CSV
        run: |
          git clone --depth 1 https://github.com/MORE-EU/OpenData.git pinned_upstream
          test "$(git -C pinned_upstream hash-object 'Solar Park Data -INACCESS/Array Power.csv')" = "5611277efdd581bb839ec380239846a43ebe0ba7"
      - name: Run chronology-fixed 55-train 24-test no-imputation pilot
        run: |
          PYTHONPATH=experimental python experimental/r43_retained_margin_holdout.py \
          --source "pinned_upstream/Solar Park Data -INACCESS/Array Power.csv" \
          --out R43_DERIVED_ONLY
      - name: Upload derived result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r43-retained-shortlist-timeholdout-derived-only
          path: R43_DERIVED_ONLY/
          retention-days: 30
          if-no-files-found: error

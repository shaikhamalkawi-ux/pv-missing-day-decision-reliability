name: R26H HKUST Native-Daytime Month Gate
on:
  push:
    branches: [r26e-solarmagix-source-intake]
    paths: ['.github/workflows/r26h-hkust-native-day.yml']
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hkust-zenodo-10909062-original-zip
          run-id: 42481283218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Frozen provider-native 144 slot complete month source gate
        run: python3 external_data/public_source_probes/profile_hkust_source_native.py
      - name: Preserve source-level gate only, no private/raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r26h-hkust-144slot-admission-audit
          path: R26H_HKUST_144Slot_SourceGate/
          if-no-files-found: warn
          retention-days: 30

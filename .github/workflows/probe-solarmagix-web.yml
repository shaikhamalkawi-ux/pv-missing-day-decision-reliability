name: Probe SolarMagix public page (accessibility audit)
on:
  push:
    branches: [r26e-solarmagix-source-intake]
    paths: ['.github/workflows/probe-solarmagix-web.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public landing page for source downloads
        run: |
          python3 - <<'PY'
          import re,urllib.request
          urls = [
            'https://data.mendeley.com/datasets/4zgsckxpdy/2',
            'https://data.mendeley.com/datasets/4zgsckxpdy/2/files',
            'https://data.mendeley.com/public-files/datasets/4zgsckxpdy/zip/file_downloaded?version=2',
          ]
          for url in urls:
            print('\nTARGET',url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=35) as r:
                b=r.read(1000000)
                t=b.decode('utf-8','replace')
                print('HTTP',r.status,'FINAL',r.url[:180],'BYTES',len(b),'CONTENT_TYPE',r.headers.get('content-type'))
                for key in ['stations.csv','hourly_pv_weather_inverter.csv','__NEXT_DATA__','file_downloaded','download_url','files','Download All','api.data.mendeley.com']:
                  m=re.search(re.escape(key),t,re.I)
                  print('TOKEN',key,'FOUND',bool(m),'CONTEXT',repr(t[max(0,m.start()-110):m.start()+180])[:430] if m else '')
                print('JS_ASSETS', re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',t)[:15])
            except Exception as ex:
              print('ERROR',type(ex).__name__,str(ex)[:300])
          PY
